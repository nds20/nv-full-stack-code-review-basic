name: BeastMode Review
on: 
  push:
  pull_request:
  workflow_dispatch: # <--- THIS ADDS A "RUN WORKFLOW" BUTTON
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Debug Start
        run: echo "--- BEAST MODE ENGINE STARTING ---"
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Run Review
        env:
          BEAST_LICENSE_KEY: ${{ secrets.BEAST_LICENSE_KEY }}
        run: node nv-full-stack-review-engine.js --pr ${{ github.event.pull_request.number || '1' }}
